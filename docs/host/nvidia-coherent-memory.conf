# Driver-managed coherent memory (CDMM): keep GB300 HBM out of the Linux page allocator so the kernel
# cannot put page cache there and CPU memory tools only show Grace RAM. NVIDIA default from R610 on Station GB300.
# Set 2026-09-25; revert by deleting this file and rebooting.
options nvidia NVreg_CoherentGPUMemoryMode=driver
